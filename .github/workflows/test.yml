name: Tests
on:
  push:
  pull_request:
  workflow_call:

jobs:
  python-core:
    name: python-core (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check .
      - run: mypy

  python-full:
    name: python-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt aiohttp pillow av
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q

  comfyui-integration:
    name: comfyui-integration (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            comfy-ref: v0.31.0
            canary: false
          - label: v0.34.0
            comfy-ref: v0.34.0
            canary: false
          - label: master
            comfy-ref: master
            canary: true
    continue-on-error: ${{ matrix.canary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: git clone --depth 1 --branch ${{ matrix.comfy-ref }} https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - name: Install Wan parity test dependencies
        if: ${{ matrix.label == 'v0.34.0' }}
        run: pip install pytest==9.0.2
      - run: PYTHONPATH=.comfyui:. python scripts/comfy_integration_smoke.py
      - name: Run official Wan camera parity
        if: ${{ matrix.label == 'v0.34.0' }}
        env:
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_REQUIRE_OFFICIAL_WAN_PARITY: "1"
        run: PYTHONPATH=.comfyui:. python -m pytest tests/parity/test_wan_camera_official_parity.py -q

  comfyui-browser:
    name: comfyui-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.34.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"

  comfyui-browser-current-frontend:
    name: comfyui-browser-current-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.34.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.54.1"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.54.1"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python scripts/verify_package.py
      - name: Pack and inspect the Registry archive
        run: |
          pip install comfy-cli
          comfy --skip-prompt --no-enable-telemetry node pack
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("node.zip") as archive:
              names = set(archive.namelist())
          def has(path: str) -> bool:
              return any(name == path or name.endswith("/" + path) for name in names)
          missing = [path for path in ("__init__.py", "omnicam/__init__.py", "web/omnicam.js", "pyproject.toml") if not has(path)]
          if missing:
              raise SystemExit(f"Registry archive missing required files: {missing}")
          if not any("web-chunks/" in name and name.endswith(".js") for name in names):
              raise SystemExit("Registry archive missing generated web-chunks JavaScript")
          print(f"Registry archive smoke: OK ({len(names)} files)")
          PY
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
