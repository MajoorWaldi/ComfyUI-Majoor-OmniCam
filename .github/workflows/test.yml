name: Tests
on:
  push:
  pull_request:
  workflow_call:

jobs:
  python-core:
    name: python-core (${{ matrix.python-version }})
    # Deliberately installs only requirements-dev.txt: the model-agnostic core
    # must stay testable without ComfyUI or torch. Suites that genuinely need an
    # optional dependency skip themselves via pytest.importorskip.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check .
      - run: mypy

  python-full:
    name: python-full
    # Same suite with the ComfyUI runtime dependencies present, so the route and
    # video-sampling tests that python-core skips are actually exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt aiohttp pillow av
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q

  comfyui-integration:
    name: comfyui-integration (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            comfy-ref: v0.31.0
            canary: false
          - label: v0.34.0
            comfy-ref: v0.34.0
            canary: false
          - label: master
            comfy-ref: master
            canary: true
    # Master is early warning only. Stable support is defined by the two tagged
    # lanes above, which must remain green.
    continue-on-error: ${{ matrix.canary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: git clone --depth 1 --branch ${{ matrix.comfy-ref }} https://github.com/Comfy-Org/ComfyUI.git .comfyui
      # ComfyUI's requirements.txt leaves torch unpinned; the default index now
      # resolves it to a CUDA build whose nvidia-* wheels overflow the runner
      # disk. Satisfy torch/vision/audio from the CPU index first.
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: PYTHONPATH=.comfyui:. python scripts/comfy_integration_smoke.py

  comfyui-browser:
    name: comfyui-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.34.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      # See comfyui-integration: CPU torch first so the unpinned CUDA build does
      # not fill the runner disk.
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:unit
      - run: git diff --exit-code -- web/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
