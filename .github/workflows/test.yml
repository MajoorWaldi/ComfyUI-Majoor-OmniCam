name: Tests
on:
  push:
  pull_request:
  workflow_call:

jobs:
  python-core:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check omnicam tests

  comfyui-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 --branch v0.31.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install -r .comfyui/requirements.txt
      - run: PYTHONPATH=.comfyui:. python scripts/comfy_integration_smoke.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:unit
      - run: git diff --exit-code -- web/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
