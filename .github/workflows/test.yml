name: Tests
on:
  push:
  pull_request:
  workflow_call:

jobs:
  # Lint + types + the full unit suite on every supported interpreter. torch is
  # in requirements-dev, so the deterministic reconstruction tests (fake
  # providers, no CUDA) run here too.
  python-core:
    name: python-core (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check .
      - run: mypy

  # Reconstruction lane: CPU torch + aiohttp + pillow + PyAV so the semantic
  # blockout / VGGT scan / SAM3D pipelines run end-to-end against their fake
  # providers, plus the reconstruction frontend node tests. No model weights,
  # no CUDA -- the real SAM3/VGGT/SAM3D adapters are exercised only by the
  # manual GPU gates.
  python-reconstruction:
    name: python-reconstruction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt aiohttp pillow av
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q tests/reconstruction tests/test_validation.py tests/test_schemas.py
      - run: npm ci
      - run: node --test tests/frontend/extractor-reconstruction-*.node.mjs tests/frontend/reconstruction-inspector.node.mjs

  comfyui-integration:
    name: comfyui-integration (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            comfy-ref: v0.31.0
            canary: false
          - label: previous
            comfy-ref: v0.34.0
            canary: false
          - label: stable
            comfy-ref: v0.35.0
            canary: false
          - label: master
            comfy-ref: master
            canary: true
    continue-on-error: ${{ matrix.canary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: git clone --depth 1 --branch ${{ matrix.comfy-ref }} https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - name: Install Wan parity test dependencies
        if: ${{ matrix.label == 'stable' }}
        run: pip install pytest==9.0.2
      - run: PYTHONPATH=.comfyui:. python scripts/comfy_integration_smoke.py
      - name: Run official Wan camera parity
        if: ${{ matrix.label == 'stable' }}
        env:
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_REQUIRE_OFFICIAL_WAN_PARITY: "1"
        run: PYTHONPATH=.comfyui:. python -m pytest tests/parity/test_wan_camera_official_parity.py -q

  comfyui-browser:
    name: comfyui-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.35.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"

  comfyui-browser-minimum-frontend:
    name: comfyui-browser-minimum-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.31.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.48.7"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.48.7"

  comfyui-browser-pinned-frontend:
    name: comfyui-browser-pinned-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: git clone --depth 1 --branch v0.35.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.55.2"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@1.55.2"

  comfyui-browser-latest-frontend:
    name: comfyui-browser-latest-frontend
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Resolve latest ComfyUI frontend release
        id: frontend
        shell: bash
        run: |
          VERSION="$(python -c 'import json, urllib.request; payload=json.load(urllib.request.urlopen("https://api.github.com/repos/Comfy-Org/ComfyUI_frontend/releases/latest", timeout=30)); print(str(payload["tag_name"]).removeprefix("v"))')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - run: git clone --depth 1 --branch v0.35.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .comfyui/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: rsync -a --delete --exclude .git --exclude .comfyui --exclude node_modules ./ .comfyui/custom_nodes/ComfyUI-Majoor-OmniCam/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@${{ steps.frontend.outputs.version }}"
      - run: npm run test:live
        env:
          OMNICAM_LIVE_AUTOSTART: "1"
          OMNICAM_COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
          OMNICAM_LIVE_MATCH: "live-vue-ci.spec.js"
          OMNICAM_LIVE_COMFY_ARGS: "--front-end-version Comfy-Org/ComfyUI_frontend@${{ steps.frontend.outputs.version }}"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python scripts/verify_package.py
      - name: Pack and audit the exact Registry archive
        run: |
          pip install comfy-cli==1.20.0
          comfy --skip-prompt --no-enable-telemetry node pack
          test -f node.zip
          python scripts/registry_package_audit.py node.zip
      - run: npm run check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
