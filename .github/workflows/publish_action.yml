name: Publish to Comfy registry

# The Registry publishes whatever version is written in pyproject.toml, so the
# release trigger is a version bump landing on main (or a manual dispatch).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# The reusable test workflow needs repository contents for checkout. Publishing
# also needs issue permission only if the workflow itself chooses to report a
# failure; keeping both explicit avoids the caller stripping contents:read.
permissions:
  contents: write
  issues: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # Never fires from a fork.
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the frontend bundle
        # web-chunks/ and web/omnicam.js are gitignored, not committed: a
        # Windows checkout and Linux CI resolve a genuinely different Vite
        # module graph for the same web-src/ (268 vs 260 modules measured
        # 2026-09-06), not just different chunk-hash filenames -- committing
        # whichever platform happened to build last has already been tried
        # twice (515c835, dbdcc22) and reverted once for exactly this reason
        # (8ec2bba). Build immediately before packaging and keep this
        # workspace intact through `comfy node publish`; a second checkout
        # would git-clean these files.
        run: |
          npm ci
          npm run build
          test -f web/omnicam.js
          test -d web-chunks
      - name: Fetch current external adapter contracts
        run: |
          git clone --depth 1 https://github.com/Lightricks/ComfyUI-LTXVideo.git .adapter-release/ltx
          git clone --depth 1 https://github.com/kijai/ComfyUI-WanVideoWrapper.git .adapter-release/wan-video-wrapper
      - name: Verify external adapter contracts
        # Release gate: a version bump does not publish while an upstream
        # contract OmniCam pins has drifted. The weekly canary stays advisory;
        # this step is blocking.
        run: python scripts/adapter_contract_canary.py .adapter-release/ltx .adapter-release/wan-video-wrapper
      - name: Install Comfy CLI
        run: pip install comfy-cli
      - name: Verify release contract
        run: pytest -q tests/test_release_contract.py
      - name: Pack Registry archive
        run: |
          comfy --skip-prompt --no-enable-telemetry node pack
          test -f node.zip
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(python -c 'from pathlib import Path; lines=Path("pyproject.toml").read_text(encoding="utf-8").splitlines(); print(next(line.split("=", 1)[1].strip().strip("\"") for line in lines if line.startswith("version = ")))')"

          TAG="v${VERSION}"
          ASSET="majoor-omnicam-${VERSION}.zip"

          cp node.zip "${ASSET}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: majoor-omnicam-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.asset }}
      - name: Publish Custom Node
        # Do not use the pinned publish-node composite action here: that action
        # performs its own actions/checkout, whose default git clean removes the
        # generated, git-ignored frontend immediately before packaging.
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy --skip-prompt --no-enable-telemetry node publish --token "${{ secrets.REGISTRY_ACCESS_TOKEN }}"
      - name: Create synchronized GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing archive."
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "Majoor OmniCam ${TAG}" \
              --generate-notes
          fi
