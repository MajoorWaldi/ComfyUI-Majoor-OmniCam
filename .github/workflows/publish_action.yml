name: Publish to Comfy registry

# The Registry publishes whatever version is written in pyproject.toml, so the
# release trigger is a version bump landing on main (or a manual dispatch).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

# The reusable test workflow needs repository contents for checkout. Publishing
# also needs issue permission only if the workflow itself chooses to report a
# failure; keeping both explicit avoids the caller stripping contents:read.
permissions:
  contents: read
  issues: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Never fires from a fork.
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No frontend build here: web-chunks/ and web/omnicam.js are committed
      # (see .gitignore), and the `frontend` job above (this workflow's
      # `needs: test`) already builds and tests them from source on every run.
      # Publishing the checked-out tree as-is, instead of regenerating it in
      # this job, means the archive the Registry receives is byte-for-byte
      # what this commit shows on GitHub -- nothing is synthesized here for a
      # reviewer to take on faith.
      - name: Fetch current external adapter contracts
        run: |
          git clone --depth 1 https://github.com/Lightricks/ComfyUI-LTXVideo.git .adapter-release/ltx
          git clone --depth 1 https://github.com/kijai/ComfyUI-WanVideoWrapper.git .adapter-release/wan-video-wrapper
      - name: Verify external adapter contracts
        # Release gate: a version bump does not publish while an upstream
        # contract OmniCam pins has drifted. The weekly canary stays advisory;
        # this step is blocking.
        run: python scripts/adapter_contract_canary.py .adapter-release/ltx .adapter-release/wan-video-wrapper
      - name: Publish Custom Node
        # The official action's own checkout is redundant now that nothing is
        # generated in this job (skip_checkout avoids doing it twice); its
        # earlier git-clean risk to a freshly built, uncommitted bundle no
        # longer applies, so there is no more reason to hand-roll comfy-cli.
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: true
