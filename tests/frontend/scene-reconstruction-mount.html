<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OmniCam Scene Reconstruction E2E Mount</title>
    <style>body { background: #111; color: #eee; font-family: sans-serif; } .pi { display: inline-block; width: 14px; height: 14px; }</style>
    <script type="importmap">
      { "imports": { "/scripts/app.js": "/tests/frontend/stubs/app.js", "/scripts/api.js": "/tests/frontend/stubs/api.js" } }
    </script>
  </head>
  <body>
    <div id="status">loading</div>
    <div id="extractor-host"></div>
    <div id="director-host"></div>
    <script type="module">
      window.addEventListener("error", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMountError = String(event.error?.stack || event.message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMountError = String(event.reason?.stack || event.reason);
      });

      try {
        const { app } = await import("/tests/frontend/stubs/app.js");
        const { api } = await import("/tests/frontend/stubs/api.js");
        await import("/web/omnicam.js");

        const extractorExtension = (window.__omnicamExtensions || []).find((item) => item.name === "Majoor.OmniCam.Extractor");
        const directorExtension = (window.__omnicamExtensions || []).find((item) => item.name === "Majoor.OmniCam.Director");

        if (!extractorExtension || !directorExtension) {
          throw new Error("Extensions failed to register");
        }

        const graphLinks = new Map();
        const graph = {
          _nodes: [],
          links: graphLinks,
          getNodeById(id) {
            return this._nodes.find((n) => n.id === id) || null;
          },
          setDirtyCanvas() {},
        };

        const extractorNode = {
          id: 1,
          comfyClass: "MajoorOmniCamExtractor",
          graph,
          widgets: [
            { name: "extract_mode", value: "camera_track" },
            { name: "source_ref", value: "test_room.png [input]" },
            { name: "scene_json", value: "" },
            { name: "fingerprint", value: "" },
          ],
          inputs: [],
          outputs: [
            {
              name: "solved_scene",
              type: "OMNICAM_MOTION_SCENE",
              links: [101],
            },
          ],
          size: [520, 700],
          pos: [0, 0],
          addDOMWidget(name, type, element) {
            document.querySelector("#extractor-host").appendChild(element);
            return { element, options: {} };
          },
          setSize() {},
        };

        const directorNode = {
          id: 2,
          comfyClass: "MajoorOmniCamDirector",
          graph,
          widgets: [
            { name: "state_json", value: JSON.stringify({
              version: 1,
              timeline: { duration_seconds: 5.0, authoring_fps: 24.0 },
              canvas: { width: 1280, height: 720 },
              cameras: [{ id: "camera_1", name: "Camera 1", keyframes: [] }],
              active_camera_id: "camera_1",
              playblast_camera_id: "camera_1",
              objects: [],
              motion_layers: [],
              cuts: [],
              metadata: {},
            }) },
            { name: "recording_path", value: "" },
            { name: "card_asset", value: "" },
            { name: "width", value: 1280 },
            { name: "height", value: 720 },
            { name: "fps", value: 24 },
            { name: "duration_seconds", value: 5 },
            { name: "render_mode", value: "omni_ref" },
          ],
          inputs: [
            {
              name: "solved_scene",
              type: "OMNICAM_MOTION_SCENE",
              link: 101,
            },
          ],
          outputs: [],
          size: [800, 800],
          pos: [600, 0],
          addDOMWidget(name, type, element) {
            document.querySelector("#director-host").appendChild(element);
            return { element, options: {} };
          },
          setSize() {},
        };

        graph._nodes.push(extractorNode, directorNode);
        graphLinks.set(101, {
          id: 101,
          origin_id: 1,
          origin_slot: 0,
          target_id: 2,
          target_slot: 0,
        });

        await extractorExtension.nodeCreated(extractorNode);
        await directorExtension.nodeCreated(directorNode);

        window.omnicamExtractor = extractorNode;
        window.omnicamDirector = directorNode;
        window.omnicamApi = api;

        // Populate source info for extractor so it considers source ready
        if (extractorNode.__majoorOmniCamExtractor) {
          const src = {
            kind: "single_image",
            ref: "test_room.png [input]",
            info: { width: 1280, height: 720, kind: "single_image" },
          };
          extractorNode.__majoorOmniCamExtractor.state.source = src;
          extractorNode.__majoorOmniCamExtractor.reconstruction?.setSource(src);
        }

        document.querySelector("#status").textContent = "ready";
      } catch (err) {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMountError = String(err?.stack || err);
      }
    </script>
  </body>
</html>
