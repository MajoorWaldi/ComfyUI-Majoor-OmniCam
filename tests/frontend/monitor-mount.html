<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>OmniCam Monitor test</title><style>body{margin:0;background:#09090d}#host{width:760px;margin:10px}</style></head>
  <body><div id="status">loading</div><div id="director-host"></div><div id="host"></div>
    <script type="module">
      import { buildMonitorRoot } from "/web-src/monitor/template.js";
      import { headerMarkup } from "/web-src/template/header.js";
      import { renderHealth } from "/web-src/monitor/health-view.js";
      import { renderPreflight } from "/web-src/monitor/preflight-view.js";
      import { renderPreview } from "/web-src/monitor/preview.js";
      import { bindTextPanels } from "/web-src/monitor/text-panels.js";
      try {
        const root = buildMonitorRoot(); document.querySelector("#host").appendChild(root);
        const director = document.querySelector("#director-host");
        director.className = "majoor-omnicam";
        director.innerHTML = headerMarkup();
        const snapshot = {
          health: { state: "READY", metrics: [{ label: "Max Speed", value: 2.4, unit: "u/s", state: "ready" }] },
          preflight: { state: "WARNING", adapter: "wan_ati", checks: [{ label: "Downstream adapter contract", state: "WARNING", message: "Verify socket contract." }], issues: [] },
          preview: { kind: "trajectory_overlay", label: "OUTPUT PREVIEW — ATI Tracks", exact_output_representation: true, payload: { width: 320, height: 180, tracks: [[{ x: 20, y: 40 }, { x: 260, y: 120 }]] } },
          text: { cinematography: "Smooth lateral move.", camera_prompt: "Copy camera motion only.", final_prompt: "A quiet street. Copy camera motion only.", camera_data: { fps: 24 } },
        };
        renderHealth(root.querySelector('[data-role="camera-health"]'), snapshot.health);
        renderPreflight(root.querySelector('[data-role="adapter-preflight"]'), snapshot.preflight);
        renderPreview(root.querySelector('[data-role="adapter-preview"]'), snapshot.preview);
        bindTextPanels(root).render(snapshot);
        const badge = root.querySelector('[data-role="monitor-status"]'); badge.dataset.state = "WARNING"; badge.lastChild.textContent = " WARNING";
        document.querySelector("#status").textContent = "ready";
      } catch (error) { window.monitorError = String(error?.stack || error); document.querySelector("#status").textContent = "failed"; }
    </script>
  </body>
</html>
