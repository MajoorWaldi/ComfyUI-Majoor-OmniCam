<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><title>OmniCam Director mount test</title>
    <style>body { background: #111; }</style>
    <script type="importmap">
      { "imports": { "/scripts/app.js": "/tests/frontend/stubs/app.js", "/scripts/api.js": "/tests/frontend/stubs/api.js" } }
    </script>
  </head>
  <body>
    <div id="status">loading</div>
    <div id="host"></div>
    <script type="module">
      window.addEventListener("error", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(event.error?.stack || event.message) };
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(event.reason?.stack || event.reason) };
      });
      try {
        const { app } = await import("/tests/frontend/stubs/app.js");
        await import("/web/omnicam.js");
        const extension = window.__omnicamExtension;
        if (!extension) throw new Error("Extension did not register");
        const node = {
          comfyClass: "MajoorOmniCamDirector",
          widgets: [
            { name: "state_json", value: JSON.stringify({ cameras: [{ id: "camera_1", name: '<img data-omnicam-xss src=x onerror="window.__omnicamXss=true">', keyframes: [] }], active_camera_id: "camera_1", playblast_camera_id: "camera_1", objects: [{ id: "qa_cube", name: "QA Cube", type: "cube", position: [0, 0.5, 0], rotation: [0, 0, 0], size: [1, 1, 1], keyframes: [], enabled: true }] }) },
            { name: "recording_path", value: "" },
            { name: "card_asset", value: "" },
            { name: "width", value: 1280 },
            { name: "height", value: 720 },
            { name: "fps", value: 24 },
            { name: "duration_seconds", value: 5 },
            { name: "render_mode", value: "omni_ref" },
          ],
          size: [800, 800],
          pos: [0, 0],
          graph: { setDirtyCanvas() {} },
          addDOMWidget(name, type, element, options) {
            document.querySelector("#host").appendChild(element);
            return { element, options };
          },
          setSize() {},
          connect() { return true; },
        };
        await extension.nodeCreated(node);
        window.omnicamNode = node;
        await new Promise((resolve) => setTimeout(resolve, 250));
        const root = document.querySelector(".majoor-omnicam");
        const canvas = root?.querySelector(".viewport-wrap > canvas");
        window.omnicamMount = {
          mounted: Boolean(root),
          canvasSized: Boolean(canvas && canvas.width > 0),
          hasTimeline: Boolean(root?.querySelector('[data-role="keys"]')),
          hasCurve: Boolean(root?.querySelector('[data-role="curve-canvas"]')),
          hasPreviews: Boolean(root?.querySelector('[data-role="camera-previews"]')),
          keysCount: root?.querySelectorAll(".key").length ?? 0,
          unsafeNameElements: root?.querySelectorAll("[data-omnicam-xss]").length ?? 0,
          nameExecuted: Boolean(window.__omnicamXss),
          statusText: root?.querySelector('[data-role="status"]')?.textContent,
        };
        document.querySelector("#status").textContent = "ready";
      } catch (error) {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(error?.stack || error) };
      }
    </script>
  </body>
</html>
