<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>OmniCam Sequencer mount test</title></head>
  <body>
    <div id="status">loading</div>
    <div id="mount"></div>
    <script type="module">
      try {
        await import("/web/omnicam.js");
        const extension = window.__omnicamExtensions.find((item) => item.name === "MajoorOmniCam.Sequencer");
        const stateWidget = { name: "sequence_state", value: JSON.stringify({
          schema_version: 2,
          timeline: { fps_num: 24, fps_den: 1, playhead_frame: 0, ripple: true, zoom: 1, scroll_x: 0 },
          selected_clip_id: null,
          shot_order: [],
          shots: {},
          audio_tracks: {},
        }) };
        const node = {
          comfyClass: "MajoorOmniCamSequencer",
          widgets: [stateWidget],
          inputs: [{ name: "shots.shot0", link: 1 }, { name: "shot_collection", link: 3 }, { name: "audio_tracks.audio0", link: null }],
          graph: {
            links: new Map([[3, { origin_id: 99 }]]),
            getNodeById(id) { return id === 99 ? { widgets: [{ name: "state_json", value: JSON.stringify({ fps: 24, duration_frames: 36, cameras: [{ id: "wide", name: "Wide" }, { id: "close", name: "Close" }] }) }] } : null; },
            setDirtyCanvas() {},
          },
          size: [760, 600],
          setSize(size) { this.size = size; },
          addDOMWidget(_name, _type, element) { document.querySelector("#mount").appendChild(element); return { element }; },
        };
        await extension.nodeCreated(node);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const initialState = JSON.parse(stateWidget.value);
        const timeline = document.querySelector(".omnicam-sequencer-canvas");
        const timelineRect = timeline.getBoundingClientRect();
        timeline.dispatchEvent(new PointerEvent("pointerdown", { clientX: timelineRect.left + 12, clientY: timelineRect.top + 52, bubbles: true }));
        const selectedGraphShot = node.__majoorOmniCamSequencer.speedGraph.lastRenderedShotId;
        node.inputs[0].link = null;
        node.onConnectionsChange?.(1, 0, false, null);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const disconnectedState = JSON.parse(stateWidget.value);
        window.omnicamSequencerMount = {
          mounted: Boolean(node.__majoorOmniCamSequencer),
          hasToolbar: Boolean(document.querySelector(".omnicam-sequencer-toolbar")),
          hasCanvas: Boolean(document.querySelector(".omnicam-sequencer-canvas")),
          hasSpeedGraph: Boolean(document.querySelector(".omnicam-sequencer-speed-graph")),
          buttonCount: document.querySelectorAll(".omnicam-sequencer-toolbar button").length,
          hiddenState: stateWidget.type === "hidden",
          collectionShotCount: Object.values(initialState.shots).filter((shot) => shot.source_slot.startsWith("collection_shot")).length,
          connectedVideoCount: Object.values(initialState.shots).filter((shot) => shot.source_slot === "shot0").length,
          selectedGraphShot,
          disconnectedVideoCount: Object.values(disconnectedState.shots).filter((shot) => shot.source_slot === "shot0").length,
        };
        document.querySelector("#status").textContent = "ready";
      } catch (error) {
        window.omnicamSequencerMount = { error: String(error?.stack || error) };
        document.querySelector("#status").textContent = "failed";
      }
    </script>
  </body>
</html>
