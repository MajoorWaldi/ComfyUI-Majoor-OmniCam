<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><title>OmniCam Director workflow-load ordering test</title>
    <style>body { background: #111; }</style>
    <script type="importmap">
      { "imports": { "/scripts/app.js": "/tests/frontend/stubs/app.js", "/scripts/api.js": "/tests/frontend/stubs/api.js" } }
    </script>
  </head>
  <body>
    <div id="status">loading</div>
    <div id="host"></div>
    <script type="module">
      // Reproduces how ComfyUI loads a saved workflow: nodeCreated is called
      // from the node constructor and NOT awaited, so configure() runs -- and
      // onConfigure fires -- while the Director chunk is still downloading.
      // The Director must still end up showing the workflow's state.
      const fail = (error) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamLoad = { error: String(error?.stack || error?.message || error) };
      };
      window.addEventListener("error", (event) => fail(event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => fail(event.reason));
      try {
        await import("/tests/frontend/stubs/app.js");
        await import("/web/omnicam.js");
        const extension = (window.__omnicamExtensions || []).find((item) => item.name === "Majoor.OmniCam.Director");
        if (!extension) throw new Error("Director extension did not register");

        const camera = (id) => ({ id, name: id, keyframes: [] });
        const stateWith = (...ids) => JSON.stringify({
          cameras: ids.map(camera), active_camera_id: ids[0], playblast_camera_id: ids[0], objects: [],
        });

        const stateWidget = { name: "state_json", value: stateWith("constructed") };
        const node = {
          comfyClass: "MajoorOmniCamDirector",
          widgets: [
            stateWidget,
            { name: "recording_path", value: "" }, { name: "card_asset", value: "" },
            { name: "width", value: 1280 }, { name: "height", value: 720 },
            { name: "fps", value: 24 }, { name: "duration_seconds", value: 5 },
            { name: "render_mode", value: "omni_ref" },
          ],
          size: [800, 800], pos: [0, 0],
          graph: { setDirtyCanvas() {} },
          addDOMWidget(name, type, element) {
            document.querySelector("#host").appendChild(element);
            return { element, options: {} };
          },
          setSize() {}, connect() { return true; },
        };

        // Deliberately NOT awaited -- this is the whole point of the test.
        const created = extension.nodeCreated(node);

        // ComfyUI's configure() now runs synchronously, writing the saved
        // widget values and firing the graph callbacks.
        stateWidget.value = stateWith("from_workflow_a", "from_workflow_b");
        node.onConfigure?.({});
        node.onAfterGraphConfigured?.();

        await created;
        await new Promise((resolve) => setTimeout(resolve, 400));

        const ui = node.__majoorOmniCam;
        window.omnicamLoad = {
          attached: Boolean(ui),
          cameraIds: (ui?.state?.cameras || []).map((item) => item.id),
        };
        document.querySelector("#status").textContent = "ready";
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
