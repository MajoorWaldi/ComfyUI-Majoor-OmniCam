<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><title>OmniCam Director docs capture</title>
    <style>body { background: #111; }</style>
    <script type="importmap">
      { "imports": { "/scripts/app.js": "/tests/frontend/stubs/app.js", "/scripts/api.js": "/tests/frontend/stubs/api.js" } }
    </script>
  </head>
  <body>
    <div id="status">loading</div>
    <div id="host"></div>
    <script type="module">
      // A clean copy of director-mount.html for documentation screenshots:
      // real camera and object names, a few keyframes so the timeline and the
      // graph editor are not empty. No security fixture strings.
      window.addEventListener("error", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(event.error?.stack || event.message) };
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(event.reason?.stack || event.reason) };
      });
      try {
        await import("/tests/frontend/stubs/app.js");
        await import("/web/omnicam.js");
        const extension = (window.__omnicamExtensions || []).find((item) => item.name === "Majoor.OmniCam.Director");
        if (!extension) throw new Error("Director extension did not register");
        const camKey = (frame, position, target, fov) => ({
          frame, interpolation: "ease",
          camera: { position, target, fov, roll: 0, camera_type: "perspective", zoom: 1, near: 0.01, far: 10000 },
        });
        const state = {
          cameras: [{
            id: "camera_1", name: "Hero Cam", active_camera_id: "camera_1",
            keyframes: [
              camKey(0, [7, 4, 7], [0, 1.4, 0], 38),
              camKey(48, [4.5, 3.2, 8.5], [0, 1.4, 0], 34),
              camKey(96, [-3, 2.6, 8], [0, 1.4, 0], 40),
            ],
          }],
          active_camera_id: "camera_1", playblast_camera_id: "camera_1",
          objects: [{
            id: "subject", name: "Subject", type: "cube", position: [0, 0.5, 0],
            rotation: [0, 0, 0], size: [1, 1, 1], keyframes: [], enabled: true,
          }],
        };
        const node = {
          comfyClass: "MajoorOmniCamDirector",
          widgets: [
            { name: "state_json", value: JSON.stringify(state) },
            { name: "recording_path", value: "" },
            { name: "card_asset", value: "" },
            { name: "width", value: 1280 },
            { name: "height", value: 720 },
            { name: "fps", value: 24 },
            { name: "duration_seconds", value: 5 },
            { name: "render_mode", value: "omni_ref" },
          ],
          size: [800, 800], pos: [0, 0],
          graph: { setDirtyCanvas() {} },
          addDOMWidget(name, type, element) {
            document.querySelector("#host").appendChild(element);
            return { element, options: {} };
          },
          setSize() {}, connect() { return true; },
        };
        await extension.nodeCreated(node);
        window.omnicamNode = node;
        await new Promise((resolve) => setTimeout(resolve, 300));
        document.querySelector("#status").textContent = "ready";
      } catch (error) {
        document.querySelector("#status").textContent = "failed";
        window.omnicamMount = { error: String(error?.stack || error) };
      }
    </script>
  </body>
</html>
